name: CI
on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run audit
      - run: npm run build
      - name: Verify Cloudflare OpenNext build
        run: npx opennextjs-cloudflare build
      - name: Report audit branch CI status
        if: always() && startsWith(github.ref, 'refs/heads/audit/')
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="success"
          if [ "$JOB_STATUS" != "success" ]; then state="failure"; fi
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"Audit Branch CI\",\"description\":\"tests + audit + Next + Cloudflare build\"}"
